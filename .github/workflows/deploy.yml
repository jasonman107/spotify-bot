name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push collector
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/collector:latest
            ${{ env.IMAGE_BASE }}/collector:${{ github.sha }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,scope=collector,mode=max

      - name: Build and push trader
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.trader
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/trader:latest
            ${{ env.IMAGE_BASE }}/trader:${{ github.sha }}
          cache-from: type=gha,scope=trader
          cache-to: type=gha,scope=trader,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/spotify-bot/

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/spotify-bot
            if [ ! -f .env ]; then
              echo "ERROR: /opt/spotify-bot/.env missing on host" >&2
              echo "Copy it once: scp .env ubuntu@<host>:/opt/spotify-bot/" >&2
              exit 1
            fi
            if [ ! -f data/backfill/trajectory_obs.parquet ]; then
              echo "ERROR: model data missing on host" >&2
              echo "Run once from your machine: ./deploy/bootstrap_data.sh <host>" >&2
              exit 1
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            # --remove-orphans kills containers from renamed/removed services
            # so two traders never run at once
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
